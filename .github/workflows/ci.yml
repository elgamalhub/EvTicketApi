name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore api/EvTicket.Api.Tests/EvTicket.Api.Tests.csproj

      - name: Build
        run: dotnet build api/EvTicket.Api.Tests/EvTicket.Api.Tests.csproj -c Release --no-restore

      - name: Integration tests
        run: dotnet test api/EvTicket.Api.Tests/EvTicket.Api.Tests.csproj -c Release --no-build --nologo

  web:
    name: Web · build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps
        working-directory: web

      - name: Unit tests
        run: npm test -- --watch=false
        working-directory: web

      - name: Production build
        run: npm run build
        working-directory: web
